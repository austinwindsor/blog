# Site
name: "Austin Windsor Writing"
title: "Austin Windsor"
description: "Technical notes, case studies, and field writing on data science, cloud analytics, machine learning, and life in Taiwan."
logo: 'assets/images/logo.png'
favicon: 'assets/images/favicon.ico'
mainurl: "https://austinwindsor.github.io"
baseurl: "/blog"
google_analytics: '277793939'
disqus: 'technical-blog'
mailchimp-list: 
include: ["_pages"]
permalink: /:title/

# Authors
authors:
  austin:
    name: Austin Windsor
    display_name: Austin
    avatar: 'assets/images/austin_square1.jpg'
    email: 
    description: "Data Scientist and Analytics Engineer focused on applied machine learning, AWS data systems, recommender systems, and multilingual analytics."

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives
    
# Archives
jekyll-archives:
  enabled:
    - categories
  layout: archive
  permalinks:
    category: '/category/:name/'
    
# Pagination 
paginate: 6
paginate_path: /page:num/
    
# Other
markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Adsense (change to "enabled" to activate, also your client id and ad slot. Create a new ad unit from your Adsense account to get the slot.)
adsense: "disabled"
adsense-data-ad-client: "ca-pub-3412143450191416"
adsense-data-ad-slot: "1363087678"

# Lazy Images ("enabled" or "disabled")
lazyimages: "disabled"

exclude: [changelog.md, LICENSE.txt, README.md, Gemfile, Gemfile.lock]
